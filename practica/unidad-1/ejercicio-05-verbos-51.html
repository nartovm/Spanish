    <div class="container" style="max-width: 900px;">
        <header class="exercise-header">
            <h1>51. Pretérito indefinido o perfecto</h1>
            <p style="color: var(--text-secondary);">Complete con el pretérito indefinido o el pretérito perfecto de los
                verbos entre paréntesis.</p>
            <a href="../../teoria/sistema-verbal/index.html" style="font-size: 0.85rem; color: var(--accent);">→ Ver
                tabla de tiempos</a>
        </header>

        <!-- Exercise 51.1 -->
        <div class="text-card" data-section="1">
            <div class="text-card-header">51.1</div>
            <div class="text-card-body">
                <div class="vocab-grid" style="grid-template-columns: 1fr;">
                    <div class="vocab-item" data-answer="q1">
                        <label>
                            <span>1. (Nosotros, comprar) <input type="text" style="width: 150px;"> esos cuadros hace
                                mucho tiempo.</span>
                            <span class="answer-reveal">Compramos</span>
                        </label>
                    </div>
                    <div class="vocab-item" data-answer="q2">
                        <label>
                            <span>2. Mis padres (vivir) <input type="text" style="width: 150px;"> en México hace
                                años.</span>
                            <span class="answer-reveal">vivieron</span>
                        </label>
                    </div>
                    <div class="vocab-item" data-answer="q3">
                        <label>
                            <span>3. ¿Cuándo (independizarse) <input type="text" style="width: 150px;"> México de
                                España? –México (independizarse) <input type="text" style="width: 150px;"> de España
                                hace unos 190 años.</span>
                            <span class="answer-reveal">se independizó / se independizó</span>
                        </label>
                    </div>
                    <div class="vocab-item" data-answer="q4">
                        <label>
                            <span>4. (Yo, hablar) <input type="text" style="width: 150px;"> con el médico hace cinco
                                minutos.</span>
                            <span class="answer-reveal">He hablado</span>
                        </label>
                    </div>
                    <div class="vocab-item" data-answer="q5">
                        <label>
                            <span>5. (Yo, hablar) <input type="text" style="width: 150px;"> con el médico hace ya
                                tiempo.</span>
                            <span class="answer-reveal">Hablé</span>
                        </label>
                    </div>
                    <div class="vocab-item" data-answer="q6">
                        <label>
                            <span>6. (Nosotros, salir) <input type="text" style="width: 150px;"> de la oficina hace un
                                momento.</span>
                            <span class="answer-reveal">Hemos salido</span>
                        </label>
                    </div>
                    <div class="vocab-item" data-answer="q7">
                        <label>
                            <span>7. Mis primos son muy pesados. Los (tener) <input type="text" style="width: 150px;">
                                en casa hasta hace un par de días.</span>
                            <span class="answer-reveal">he tenido</span>
                        </label>
                    </div>
                    <div class="vocab-item" data-answer="q8">
                        <label>
                            <span>8. –¿Cuándo (tú, estar) <input type="text" style="width: 150px;"> en Chiapas? –Hace
                                muchos años.</span>
                            <span class="answer-reveal">estuviste</span>
                        </label>
                    </div>
                </div>
                <div class="section-actions"><button type="button" class="btn-check-section"
                        onclick="checkSection('1')">✓ Comprobar</button></div>
                <div class="section-result" id="result-1"></div>
            </div>
        </div>

        <!-- Exercise 51.2 -->
        <div class="text-card" data-section="2">
            <div class="text-card-header">51.2</div>
            <div class="text-card-body">
                <div class="vocab-grid" style="grid-template-columns: 1fr;">
                    <div class="vocab-item" data-answer="q2_1">
                        <label>
                            <span>1. Esta mañana (yo, tener) <input type="text" style="width: 150px;"> muchas visitas.
                                (Hablar) <input type="text" style="width: 150px;"> con muchas personas y (quedar) <input
                                    type="text" style="width: 150px;"> agotado.</span>
                            <span class="answer-reveal">he tenido / He hablado / he quedado</span>
                        </label>
                    </div>
                    <div class="vocab-item" data-answer="q2_2">
                        <label>
                            <span>2. La semana pasada (nosotros, estar) <input type="text" style="width: 150px;"> en la
                                sierra. (Caminar) <input type="text" style="width: 150px;"> por los senderos y (comer)
                                <input type="text" style="width: 150px;"> en los mesones de los pueblos. (Tener) <input
                                    type="text" style="width: 150px;"> un tiempo estupendo y nos lo (pasar) <input
                                    type="text" style="width: 150px;"> estupendamente.</span>
                            <span class="answer-reveal">estuvimos / Caminamos / comimos / Tuvimos / pasamos</span>
                        </label>
                    </div>
                    <div class="vocab-item" data-answer="q2_3">
                        <label>
                            <span>3. Ayer (decir) <input type="text" style="width: 150px;"> el hombre del tiempo que el
                                año pasado (ser) <input type="text" style="width: 150px;"> uno de los más secos del
                                siglo.</span>
                            <span class="answer-reveal">dijo / fue</span>
                        </label>
                    </div>
                    <div class="vocab-item" data-answer="q2_4">
                        <label>
                            <span>4. Anoche (llamar) <input type="text" style="width: 150px;"> tu hermana desde Buenos
                                Aires. Dice que (tener) <input type="text" style="width: 150px;"> un calor horrible
                                estas Navidades.</span>
                            <span class="answer-reveal">llamó / ha tenido</span>
                        </label>
                    </div>
                    <div class="vocab-item" data-answer="q2_5">
                        <label>
                            <span>5. Este mes (tener, nosotros) <input type="text" style="width: 150px;"> muchos gastos.
                                (Pintar) <input type="text" style="width: 150px;"> la casa y (cambiar) <input
                                    type="text" style="width: 150px;"> los suelos.</span>
                            <span class="answer-reveal">hemos tenido / Hemos pintado / hemos cambiado</span>
                        </label>
                    </div>
                </div>
                <div class="section-actions"><button type="button" class="btn-check-section"
                        onclick="checkSection('2')">✓ Comprobar</button></div>
                <div class="section-result" id="result-2"></div>
            </div>
        </div>

        <!-- Exercise 51.3 -->
        <div class="text-card" data-section="3">
            <div class="text-card-header">51.3</div>
            <div class="text-card-body">
                <div class="vocab-grid" style="grid-template-columns: 1fr;">
                    <div class="vocab-item" data-answer="q3_1">
                        <label>
                            <span>1. Mi primo Agustín (navegar) <input type="text" style="width: 150px;"> por todos los
                                mares.</span>
                            <span class="answer-reveal">ha navegado</span>
                        </label>
                    </div>
                    <div class="vocab-item" data-answer="q3_2">
                        <label>
                            <span>2. Manuela (estar) <input type="text" style="width: 150px;"> varias veces en Colombia
                                y nunca (tener) <input type="text" style="width: 150px;"> problemas. La semana pasada,
                                sin embargo, (estar) <input type="text" style="width: 150px;"> en Bogotá y le (perder)
                                <input type="text" style="width: 150px;"> las maletas.</span>
                            <span class="answer-reveal">ha estado / ha tenido / estuvo / perdieron</span>
                        </label>
                    </div>
                    <div class="vocab-item" data-answer="q3_3">
                        <label>
                            <span>3. Sonia (casarse) <input type="text" style="width: 150px;"> tres veces. La última vez
                                (casarse) <input type="text" style="width: 150px;"> hace dos años.</span>
                            <span class="answer-reveal">se ha casado / se casó</span>
                        </label>
                    </div>
                    <div class="vocab-item" data-answer="q3_4">
                        <label>
                            <span>4. –¿(Yo, leer) <input type="text" style="width: 150px;"> El Quijote tres veces. –Pues
                                yo no lo (leer) <input type="text" style="width: 150px;">.</span>
                            <span class="answer-reveal">He leído / he leído</span>
                        </label>
                    </div>
                    <div class="vocab-item" data-answer="q3_5">
                        <label>
                            <span>5. –¿(Tú, viajar) <input type="text" style="width: 150px;"> mucho? –Solo (salir)
                                <input type="text" style="width: 150px;"> una vez de España. El año pasado (ir) <input
                                    type="text" style="width: 150px;"> a Austria.</span>
                            <span class="answer-reveal">Has viajado / he salido / fui</span>
                        </label>
                    </div>
                    <div class="vocab-item" data-answer="q3_6">
                        <label>
                            <span>6. Mi mujer y yo (vivir) <input type="text" style="width: 150px;"> en muchos países.
                                En Italia (vivir) <input type="text" style="width: 150px;"> cuatro años, de 2001 a
                                2005.</span>
                            <span class="answer-reveal">hemos vivido / vivimos</span>
                        </label>
                    </div>
                </div>
                <div class="section-actions"><button type="button" class="btn-check-section"
                        onclick="checkSection('3')">✓ Comprobar</button></div>
                <div class="section-result" id="result-3"></div>
            </div>
        </div>

    <script src="../js/exercise-engine.js"></script>
    <script>
        const answers = {
            // 51.1
            q1: ["compramos"],
            q2: ["vivieron"],
            q3: ["se independizo", "se independizó"],
            q4: ["he hablado"],
            q5: ["hable", "hablé"],
            q6: ["hemos salido"],
            q7: ["he tenido"],
            q8: ["estuviste"],
            // 51.2
            q2_1: ["he tenido"],
            q2_2: ["estuvimos"],
            q2_3: ["dijo"],
            q2_4: ["llamo", "llamó"],
            q2_5: ["hemos tenido"],
            // 51.3
            q3_1: ["ha navegado"],
            q3_2: ["ha estado"],
            q3_3: ["se ha casado"],
            q3_4: ["he leido", "he leído"],
            q3_5: ["has viajado"],
            q3_6: ["hemos vivido"]
        };

        function normalizeText(text) {
            return text.toLowerCase().trim()
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        }

        function checkSection(section) {
            const card = document.querySelector(`[data-section="${section}"]`);
            const items = card.querySelectorAll('.vocab-item');
            let correct = 0, total = items.length;

            items.forEach(item => {
                const key = item.dataset.answer;
                const inputs = item.querySelectorAll('input');
                const firstInput = inputs[0];
                const userAnswer = normalizeText(firstInput.value);
                const correctAnswers = answers[key].map(a => normalizeText(a));

                item.classList.remove('correct', 'incorrect');

                if (!firstInput.value.trim()) {
                    item.classList.add('incorrect');
                } else if (correctAnswers.some(a => userAnswer.includes(a) || a.includes(userAnswer))) {
                    item.classList.add('correct');
                    correct++;
                } else {
                    item.classList.add('incorrect');
                }
            });

            const resultDiv = document.getElementById(`result-${section}`);
            resultDiv.classList.add('visible');
            resultDiv.className = correct === total ? 'section-result visible success' : 'section-result visible has-errors';
            resultDiv.innerHTML = correct === total ? `✅ ¡Perfecto! ${correct}/${total}` : `📝 ${correct}/${total} correctas`;
        }
    </script>
